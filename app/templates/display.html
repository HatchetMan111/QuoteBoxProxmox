<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14120f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QuoteBox</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="stage">
    <div class="clock" id="clock">
      <div class="time" id="clock-time">--:--</div>
      <div class="date" id="clock-date">-</div>
    </div>

    <div class="plaque" id="plaque" role="button" tabindex="0" aria-label="Nächsten Spruch anzeigen">
      <div class="category-label" id="category-label">&nbsp;</div>
      <div class="medallion" id="medallion"></div>
      <p class="quote-text" id="quote-text" aria-live="polite">&nbsp;</p>
      <div class="rule"></div>
      <div class="author" id="quote-author">&nbsp;</div>
    </div>

    <button type="button" class="corner-link fs-link" id="fullscreen-btn" aria-label="Vollbild umschalten">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V4h5"/>
        <path d="M20 9V4h-5"/>
        <path d="M4 15v5h5"/>
        <path d="M20 15v5h-5"/>
      </svg>
    </button>

    <a class="corner-link gear-link" href="/settings" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 13.5c.04-.5.04-1 0-1.5l1.9-1.5-2-3.4-2.2.9c-.4-.3-.8-.6-1.3-.8l-.3-2.4H10.5l-.3 2.4c-.5.2-.9.5-1.3.8l-2.2-.9-2 3.4 1.9 1.5c-.04.5-.04 1 0 1.5l-1.9 1.5 2 3.4 2.2-.9c.4.3.8.6 1.3.8l.3 2.4h3.9l.3-2.4c.5-.2.9-.5 1.3-.8l2.2.9 2-3.4-1.9-1.5Z"/>
      </svg>
    </a>
  </div>

  <script src="/static/js/display.js"></script>
</body>
</html>
