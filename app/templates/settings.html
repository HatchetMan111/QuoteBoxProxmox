<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14120f">
  <title>QuoteBox – Einstellungen</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="settings-wrap">
    <div class="settings-card">
      <h1>QuoteBox</h1>
      <p class="subtitle">Wähle, welche Sprüche gezeigt werden und wie.</p>

      <div id="load-error" class="load-error" hidden>
        <span>Einstellungen konnten nicht geladen werden.</span>
        <button type="button" id="retry-btn">Erneut versuchen</button>
      </div>

      <div id="settings-form" hidden>
        <div class="field-group">
          <span class="field-label">Kategorien</span>
          <div class="category-grid" id="category-grid"></div>
          <div class="grid-hint" id="grid-hint" role="status">Mindestens eine Kategorie muss aktiv bleiben.</div>
        </div>

        <div class="field-group">
          <span class="field-label">Wechselintervall</span>
          <div class="range-row">
            <input type="range" id="interval" min="5" max="300" step="5" value="20">
            <span class="range-value" id="interval-value">20 s</span>
          </div>
        </div>

        <div class="field-group">
          <span class="field-label">Darstellung</span>
          <div class="theme-choice">
            <button type="button" id="theme-dark" data-theme="dark">Dunkel</button>
            <button type="button" id="theme-light" data-theme="light">Hell</button>
          </div>
        </div>

        <div class="field-group">
          <div class="toggle-row">
            <span class="field-label inline">Uhrzeit &amp; Datum anzeigen</span>
            <label class="switch">
              <input type="checkbox" id="show-clock">
              <span class="track"><span class="thumb"></span></span>
            </label>
          </div>
        </div>

        <div class="save-bar">
          <button class="save-btn" id="save-btn" disabled>Speichern</button>
          <span class="save-status" id="save-status" role="status"></span>
        </div>
      </div>

      <a class="back-link" href="/display">← Zurück zur Anzeige</a>
    </div>
  </div>

  <script src="/static/js/settings.js"></script>
</body>
</html>
